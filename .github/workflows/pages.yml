name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          GITHUB_PAGES: "true"
      - name: Prepare Pages directory
        run: |
          if [ -d dist/client ]; then PUB=dist/client
          elif [ -d .output/public ]; then PUB=.output/public
          elif [ -d dist ]; then PUB=dist
          else
            echo "No static build output found"
            find . -name index.html -not -path './node_modules/*' | head
            exit 1
          fi
          cp "$PUB/index.html" "$PUB/404.html"
          touch "$PUB/.nojekyll"
          echo "PUB_DIR=$PUB" >> "$GITHUB_ENV"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.PUB_DIR }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
